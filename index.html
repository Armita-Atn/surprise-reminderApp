<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>یادآور تسویه | Surprise</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1b7a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root {
    --navy: #1e1b7a;
    --navy-light: #2f2ba3;
    --cyan: #23c6d6;
    --orange: #f2894a;
    --bg: #e7ecf5;
    --card: #ffffff;
    --text: #1c1c28;
    --muted: #8a8c9e;
    --danger: #e0483e;
    --warn: #f2a63c;
    --ok: #2fb673;
    --border: #ebecf3;
    --wave1: #bdeef4;
    --wave2: #6dd6e0;
    --wave3: #2bb8cc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(135deg, #1595a8, #23c6d6);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 0 0 22px 22px;
    box-shadow: 0 4px 18px rgba(20,120,140,0.25);
  }
  header img { height: 30px; }
  header h1 { color: white; font-size: 15px; margin: 0; font-weight: 600; }

  main { max-width: 480px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(20,20,50,0.05);
    border: 1px solid var(--border);
  }

  .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--navy); }

  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  input[type=text], input[type=number], input[type=password] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    font-family: inherit; font-size: 14px; margin-bottom: 12px; background: #fafbff;
  }
  .date-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .date-row select {
    flex: 1; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--border);
    font-family: inherit; font-size: 13px; background: #fafbff;
  }
  button {
    font-family: inherit; border: none; border-radius: 10px; padding: 11px 16px;
    font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .btn-primary { background: var(--navy); color: white; width: 100%; }
  .btn-primary:active { background: var(--navy-light); }

  .notif-banner {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff3e8; border: 1px solid #ffdcb8; border-radius: 12px;
    padding: 10px 14px; margin-bottom: 16px; font-size: 13px;
  }
  .notif-banner button { background: var(--orange); color: white; font-size: 12px; padding: 7px 12px; }
  .notif-banner.ok { background: #e9f9f0; border-color: #bdecd3; }

  .customer-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; border-radius: 12px; background: #fafbff; border: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .customer-item .info { flex: 1; }
  .customer-item .name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .customer-item .meta { font-size: 11px; color: var(--muted); }
  .badge {
    font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 20px; white-space: nowrap;
    margin-inline-start: 8px;
  }
  .badge.danger { background: #fde7e5; color: var(--danger); }
  .badge.warn { background: #fef1dc; color: #b9760f; }
  .badge.ok { background: #e2f7ec; color: var(--ok); }
  .del-btn {
    background: none; border: none; color: var(--muted); font-size: 18px; padding: 4px 8px; cursor: pointer;
  }
  .empty-state { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }

  /* ---------- صفحه‌ی ورود / ثبت‌نام ---------- */
  #authScreen {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: 62vh;
    position: relative;
    z-index: 1;
  }
  .auth-card {
    width: 100%; max-width: 320px;
    background: #ffffff;
    border: 1px solid #dfe3f0;
    border-radius: 18px;
    padding: 22px;
    padding-top: 40px;
    box-shadow: 0 14px 34px rgba(20,20,60,0.16);
    position: relative;
  }
  .card-badge {
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 60px;
    background: white;
    border-radius: 50%;
    border: 3px solid var(--bg);
    box-shadow: 0 4px 12px rgba(20,20,60,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .auth-tabs {
    display: flex;
    margin-bottom: 18px;
    border-radius: 10px;
    background: #eef0f8;
    padding: 4px;
  }
  .auth-tab {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
  }
  .auth-tab.active {
    background: white;
    color: var(--navy);
    box-shadow: 0 1px 4px rgba(20,20,60,0.1);
  }
  .auth-card input {
    text-align: center;
  }
  #authError {
    color: var(--danger); font-size: 12px; margin-top: 4px; display: none; text-align: center;
  }

  /* ---------- موج شناور (سه تُن آبی) ---------- */
  .wave-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: auto;
    height: 62vh;
    overflow: hidden;
    line-height: 0;
    pointer-events: none;
    z-index: 0;
  }
  .wave-wrap svg {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 60%;
  }
  .wave-l1 { animation: wave-move 30s linear infinite; opacity: 0.55; }
  .wave-l2 { animation: wave-move 20s linear infinite; opacity: 0.75; }
  .wave-l3 { animation: wave-move 13s linear infinite; opacity: 0.95; }
  @keyframes wave-move {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .wave-float {
    position: absolute;
    bottom: 34%;
    left: 50%;
    width: 170px;
    animation: wave-bob 3.8s ease-in-out infinite;
  }
  .wave-float img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 6px 14px rgba(20,20,60,0.25));
  }
  @keyframes wave-bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-9px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wave-l1, .wave-l2, .wave-l3, .wave-float { animation: none; }
  }
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-card">
    <div class="card-badge">
      <svg viewBox="0 0 24 24" width="34" height="34" xmlns="http://www.w3.org/2000/svg">
        <path fill="#1e1b7a" d="M12 2a1 1 0 0 1 1 1v1.06A7 7 0 0 1 19 11v3.28l1.6 2.4A1 1 0 0 1 19.75 18H4.25a1 1 0 0 1-.85-1.32L5 14.28V11a7 7 0 0 1 6-6.94V3a1 1 0 0 1 1-1zM10 20a2 2 0 0 0 4 0z"/>
      </svg>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin">ورود</div>
      <div class="auth-tab" id="tabSignup">ثبت‌نام</div>
    </div>
    <label>نام کاربری</label>
    <input type="text" id="authUsername" placeholder="نام کاربری">
    <label>رمز عبور</label>
    <input type="password" id="authPassword" placeholder="رمز عبور">
    <button class="btn-primary" id="authBtn" style="margin-top:6px;">ورود</button>
    <div id="authError"></div>
  </div>
</div>

<div id="appScreen" style="display:none;">
<header>
  <h1>یادآور حساب مشتریان</h1>
  <img src="logo-original.png" alt="Surprise">
</header>

<main>

  <div id="notifBanner" class="notif-banner" style="display:none;">
    <span id="notifText"></span>
    <button id="notifBtn">فعال‌سازی</button>
  </div>

  <div class="card">
    <h2>افزودن مشتری جدید</h2>
    <label>نام مشتری</label>
    <input type="text" id="custName" placeholder="مثلاً فروشگاه رفاه شعبه ۳">

    <label>مبلغ (اختیاری، ریال)</label>
    <input type="number" id="custAmount" placeholder="مثلاً 150000000">

    <label>تاریخ ورودی (شمسی)</label>
    <div class="date-row">
      <select id="dYear"></select>
      <select id="dMonth"></select>
      <select id="dDay"></select>
    </div>

    <label>مهلت تسویه (روز)</label>
    <input type="number" id="graceDays" value="25" min="1" placeholder="مثلاً 25">

    <button class="btn-primary" id="addBtn">ثبت مشتری</button>
  </div>

  <div class="card">
    <h2>لیست سررسیدها</h2>
    <div id="customerList"></div>
  </div>

</main>
</div>
